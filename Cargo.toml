[package]
name = "roost"
version = "0.1.0"
edition = "2024"
description = "Watch all your AI coding agents (Claude Code & Codex) from one terminal panel"
license = "MIT"
repository = "https://github.com/iwgyyyy/roost"
homepage = "https://github.com/iwgyyyy/roost"
readme = "README.md"
keywords = ["tui", "claude-code", "codex", "agents", "cli"]
categories = ["command-line-utilities"]

[lib]
name = "roost"
path = "src/lib.rs"

[[bin]]
name = "roost"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rustix = { version = "0.38", features = ["process", "termios"] }
libc = "0.2"
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"
toml_edit = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
axoupdater = { version = "0.10.0", features = ["github_releases", "blocking"] }

[dev-dependencies]
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
