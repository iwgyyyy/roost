[package]
name = "roost"
version = "0.1.0"
edition = "2024"

[lib]
name = "roost"
path = "src/lib.rs"

[[bin]]
name = "roost"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rustix = { version = "0.38", features = ["process", "termios"] }
libc = "0.2"
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"
toml_edit = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
